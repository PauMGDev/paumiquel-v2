<!doctype html>
<!--
  Plantilla del favicon. Se renderiza a mano con Chromium headless a 32x32
  (public/favicon.png) y a 180x180 (public/apple-touch-icon.png). La "P" va
  en Fraunces: rasterizarla evita depender de que el navegador tenga la
  fuente al pintar un SVG.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../public/fonts/fraunces-variable.woff2') format('woff2-variations');
        font-weight: 300 700;
      }
      html, body { margin: 0; }
      body {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #1c1b1a;
        font-family: 'Fraunces', serif;
        font-optical-sizing: auto;
      }
      span {
        font-size: 82cqh;
        font-weight: 650;
        line-height: 1;
        font-variation-settings: 'opsz' 144;
      }
      body { container-type: size; }
    </style>
  </head>
  <body><span>P</span></body>
</html>
